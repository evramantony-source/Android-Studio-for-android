name: Android CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Test DroidForge Studio
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Accept Android SDK licenses and install SDK 36.1
        run: |
          SDK_DIR="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          mkdir -p "$SDK_DIR/licenses"
          SDKMANAGER=$(find "$SDK_DIR/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -n 1)
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --sdk_root="$SDK_DIR" --licenses > /dev/null || true
            "$SDKMANAGER" --sdk_root="$SDK_DIR" "platforms;android-36.1" "build-tools;36.0.0" || true
          fi

      - name: Restore cached CI debug keystore
        uses: actions/cache@v4
        with:
          path: debug.keystore
          key: ci-debug-keystore-v2

      - name: Ensure consistent debug keystore
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > debug.keystore
          elif [ ! -f debug.keystore ]; then
            if [ -f debug.keystore.base64 ]; then
              base64 -d debug.keystore.base64 > debug.keystore
            else
              keytool -genkeypair -keystore debug.keystore \
                -storepass android -alias androiddebugkey -keypass android \
                -keyalg RSA -keysize 2048 -validity 10000 \
                -dname "CN=Android Debug,O=Android,C=US"
            fi
          fi
          keytool -list -keystore debug.keystore -storepass android -alias androiddebugkey

      - name: Configure .env from GitHub Secret if provided
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -n "$GEMINI_API_KEY" ]; then
            printf 'GEMINI_API_KEY=%s\n' "$GEMINI_API_KEY" > .env
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Run unit & Robolectric tests
        run: gradle :app:testDebugUnitTest --no-daemon -Dorg.gradle.jvmargs="-Xmx3g -Dfile.encoding=UTF-8"

      - name: Build Debug APK
        run: gradle :app:assembleDebug --no-daemon -Dorg.gradle.jvmargs="-Xmx3g -Dfile.encoding=UTF-8"

      - name: Upload Debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: droidforge-studio-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish rolling APK release for direct mobile download
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk droidforge-studio-debug.apk
          if gh release view latest-debug >/dev/null 2>&1; then
            gh release upload latest-debug droidforge-studio-debug.apk --clobber || true
          else
            gh release create latest-debug droidforge-studio-debug.apk \
              --title "DroidForge Studio (Latest Debug APK)" \
              --notes "Latest automated debug APK build from commit ${GITHUB_SHA::7}." \
              --prerelease || true
          fi
          {
            echo "### DroidForge Studio APK Ready"
            echo "- **Direct Mobile APK Download (Releases):** https://github.com/${{ github.repository }}/releases/tag/latest-debug"
            echo "- **Workflow Artifact:** Scroll right on the Artifacts table or use Desktop mode to download \`droidforge-studio-debug-apk\`."
          } >> "$GITHUB_STEP_SUMMARY"
